name: Generate schedule calendar

on:
  push:
    branches:
      - main
    paths:
      - "input/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/generate-schedule.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate ICS
        env:
          TZ: Asia/Shanghai
        run: python scripts/generate_schedule_ics.py

      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          git diff --cached --quiet || git commit -m "Update schedule calendar"
          git push
